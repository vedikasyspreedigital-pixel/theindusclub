<style>
    footer {
        background: #242d4a;
        color: #fff;
       /* position: fixed;*/
        bottom: 0;
        right: 0;
        left: 0;
    }
    .footer-content {
        /*margin: 20px 0;*/
        margin: 10px 0;
    }
    .footer-text {
        text-transform: uppercase;
        font-size: 0.70em;
        letter-spacing: 1px;
        margin: 0px !important;
        
    }
    .fa {
        color: #242d4a;
        background: white;
        padding: 5px;
        font-size: 15px !important;
        width: 25px;
        text-decoration: none;
        margin: 0px 15px;
        border-radius: 50%;
    }
    .fa:hover {
        text-decoration: none;
    }
    .fa-facebook:hover {
        background: #3B5998;
        color: white;
    }
    .fa-linkedin-square:hover {
        background: #007bb5;
        color: white;
    }
    .fa-instagram:hover {
        background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
        color: white;
    }
    .copyright-text {
        text-align: right;
    }
    /* ------ For Scroll-------*/
    #return-to-bottom {
        position: fixed;
        bottom: 25px;
        right: 62px;
        background: rgb(0, 0, 0);
        background: rgba(158, 130, 95, 0.42);
        width: 50px;
        height: 50px;
        display: block;
        text-decoration: none;
        -webkit-border-radius: 35px;
        -moz-border-radius: 35px;
        border-radius: 35px;
        -webkit-transition: all 0.3s linear;
        -moz-transition: all 0.3s ease;
        -ms-transition: all 0.3s ease;
        -o-transition: all 0.3s ease;
        transition: all 0.3s ease;
        z-index: 99;
    }
    #return-to-bottom i {
        color: #fff;
        margin: 0;
        position: relative;
        left: 16px;
        top: 15px;
        font-size: 19px;
        -webkit-transition: all 0.3s ease;
        -moz-transition: all 0.3s ease;
        -ms-transition: all 0.3s ease;
        -o-transition: all 0.3s ease;
        transition: all 0.3s ease;
    }
    #return-to-bottom:hover {
         background: rgba(158, 130, 95, 0.8);
    }
    #return-to-bottom:hover i {
        color: #fff;
        top: 20px;
    }
    @media only screen and (min-width: 1280px) {
        .footer-container {
            margin: 0px 10rem;
        }
    }
    @media only screen and (min-device-width: 375px) and (max-device-width: 960px) and (orientation: landscape) {
        #return-to-bottom {
            bottom: 10px;
            right: 10px;
            width:40px;
            height: 40px;
        }
        #return-to-bottom i{
            left: 10px;
            top: 10px;
        }
        #return-to-bottom:hover i {
            top: 10px;
        }
    }
    @media only screen and (max-width: 425px) and (orientation:portrait) {
        .footer-text {
            font-size: 0.65em;
        }
        #return-to-bottom {
            bottom: 10px;
            right: 10px;
            width:40px;
            height: 40px;
        }
        #return-to-bottom i{
            left: 11px;
            top: 10px;
        }
        #return-to-bottom:hover i {
            top: 10px;
        }
    }

    @media only screen and (max-width: 768px) {
        .footer-text {
            text-align: center!important;
        }
    }

    @media only screen and (max-width: 1200px) {
        .footer-content,
        .copyright-text {
            text-align: center;
        }
        .footer-content {
            margin: 20px 0;
        }
    }
</style>
<footer>
    <a href="javascript:" id="return-to-bottom"><i class="glyphicon glyphicon-menu-down"></i></a>
    <div class="container-fluid footer-container">
        <div class="row">
            <div class="col-lg-4 col-sm-12 footer-content">
                <p class="footer-text">&nbsp;The Indus Club is a venture of pinnacle lifestyle PVT. LTD.</p>
            </div>
            <div class="col-lg-4 col-sm-12 footer-content" style="text-align: center;">
                <a href="https://urlgeni.us/facebook/Ttw1" target="_blank" class="fa fa-facebook "></a>
                <a href="https://urlgeni.us/linkedin/nNUO" target="_blank" class="fa fa-linkedin-square "></a>
                <a href="https://urlgeni.us/instagram/afsd" target="_blank" class="fa fa-instagram "></a>
            </div>
            <div class="col-lg-4 col-sm-12 footer-content">
                <p class="footer-text copyright-text">Copyright @ 2018 The Indus Club&nbsp;</p>
            </div>
        </div>
    </div>
</footer>
<script>            
    $(window).scroll(function() {
        if ($(this).scrollTop() >= 50) {       
            $('#return-to-bottom').fadeOut(200);  
        } else {
            $('#return-to-bottom').fadeIn(200);  
        }
    });
    $('#return-to-bottom').click(function() {    
        $('body,html').animate({
            scrollTop : 600                      
        }, 500);
    });</script>
