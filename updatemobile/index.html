  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; }

  body {

    background: #f7f4ee;
    font-family: 'Poppins', sans-serif;
    display: flex;

  .card-outer {
    position: relative;
    width: 100%;
    max-width: 620px;
    background:
      radial-gradient(circle at 2px 2px, #d8c9a3 1.2px, transparent 1.2px) 0 0/28px 28px,
      #ffffff;
    border: 2px solid #b9924f;
    border-radius: 2px;
    padding: 55px 55px 45px;
  }

  .card-outer::before {
    content: "";
    position: absolute;
    inset: 14px;
    border: 1px solid #e3d4ae;
    pointer-events: none;
  }

  .title {
    text-align: center;
    color: #b9924f;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 4px;
    margin: 10px 0 40px;
  }

  .section-label {
    color: #2b2b2b;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 18px;
  }

  .dropdown {
    position: relative;
  }

  .dropdown-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border: none;
    border-bottom: 1px solid #b9924f;
    background: transparent;
    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #2b2b2b;
    padding: 12px 2px;
    cursor: pointer;
    text-align: left;
  }

  .dropdown-trigger.placeholder {
    color: #b7b7b7;
    font-weight: 500;
  }

  .dropdown-trigger .chevron {
    flex-shrink: 0;
    width: 11px;
    height: 11px;
    border-right: 1.5px solid #b9924f;
    border-bottom: 1.5px solid #b9924f;
    transform: rotate(45deg);
    transition: transform 0.2s ease;
    margin-top: -4px;
  }

  .dropdown.open .dropdown-trigger .chevron {
    transform: rotate(-135deg);
    margin-top: 4px;
  }

  .dropdown-panel {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    max-height: 260px;
    overflow-y: auto;
    background: #fffdf8;
    border: 1px solid #e3d4ae;
    box-shadow: 0 10px 30px rgba(60, 45, 15, 0.15);
    z-index: 50;
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .dropdown.open .dropdown-panel {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .dropdown-option {
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 500;
    color: #4a4438;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
    border-bottom: 1px solid #f1e8d3;
  }

  .dropdown-option:last-child { border-bottom: none; }

  .dropdown-option:hover {
    background: #f5ecd6;
    color: #2b2b2b;
  }

  .dropdown-option.selected {
    background: #b9924f;
    color: #fff;
    font-weight: 600;
  }

  .dropdown-panel::-webkit-scrollbar { width: 6px; }
  .dropdown-panel::-webkit-scrollbar-thumb {
    background: #d8c9a3;
    border-radius: 4px;
  }
  .dropdown-panel::-webkit-scrollbar-track { background: transparent; }

  .field-block { margin-bottom: 30px; }

  .phone-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    border-bottom: 1px solid #b9924f;
    padding-bottom: 8px;
  }

  .country-select {

  .styled-input {
    flex: 1;

    border: none;

    font-size: 16px;
    font-weight: 600;
    color: #2b2b2b;
    outline: none;
    background: transparent;
    letter-spacing: 1px;
  }

  .name-underline {
    border-bottom: 1px solid #b9924f;
    padding-bottom: 8px;
  }

  .styled-input::placeholder {
    color: #b7b7b7;
    font-weight: 500;
    opacity: 1;
  }

  .field-feedback {
    min-height: 20px;
    font-size: 12px;
    font-weight: 500;
    margin-top: 8px;
    letter-spacing: 0.3px;
  }

  .field-feedback.error { color: #c0392b; }
  .field-feedback.ok { color: #4a8f4a; }

  .submit-btn {
    width: 100%;

  .submit-btn:hover { background: #a8813f !important; }
  .submit-btn:disabled {

  .confirm-msg {

    color: #4a8f4a;
    margin-top: 14px;
    min-height: 18px;
  }

<script>
  // ---------- Country phone rules ----------
  const countries = [
    { iso: "IN", name: "India", dial: "+91", len: [10], leadRegex: /^[6-9]/ },
    { iso: "US", name: "USA", dial: "+1", len: [10] },
    { iso: "GB", name: "UK", dial: "+44", len: [10] },
    { iso: "AE", name: "UAE", dial: "+971", len: [9] },
    { iso: "AU", name: "Australia", dial: "+61", len: [9] },
    { iso: "CA", name: "Canada", dial: "+1", len: [10] },
    { iso: "SG", name: "Singapore", dial: "+65", len: [8] },
    { iso: "DE", name: "Germany", dial: "+49", len: [10, 11] },
    { iso: "FR", name: "France", dial: "+33", len: [9] },
    { iso: "OTHER", name: "Other", dial: "", len: [7,8,9,10,11,12,13,14,15] }
  ];

  const countrySelect = document.getElementById('countrySelect');
  countries.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.iso;
    opt.textContent = c.dial ? `${c.dial} ${c.name}` : c.name;
    countrySelect.appendChild(opt);
  });
  countrySelect.value = "IN";

  const phoneInput = document.getElementById('phoneInput');
  const phoneFeedback = document.getElementById('phoneFeedback');
  const realMobileField = document.getElementsByName('Phone_Submitted')[0];
  let phoneValid = false;

  function currentCountry() {
    return countries.find(c => c.iso === countrySelect.value);
  }

  function syncMobileField() {
    const country = currentCountry();
    const raw = phoneInput.value.replace(/[\s-]/g, '');
    realMobileField.value = (country.dial ? country.dial + ' ' : '') + raw;
  }

  function validatePhone() {
    const country = currentCountry();
    const raw = phoneInput.value.replace(/[\s-]/g, '');
    phoneValid = false;

    if (!raw) {
      phoneFeedback.textContent = "";
      phoneFeedback.className = "field-feedback";
      syncMobileField();
      updateScheduleState();
      return;
    }

    if (!/^\d+$/.test(raw)) {
      phoneFeedback.textContent = "Only digits are allowed.";
      phoneFeedback.className = "field-feedback error";
      syncMobileField();
      updateScheduleState();
      return;
    }

    if (!country.len.includes(raw.length)) {
      const lens = country.len.join(" or ");
      phoneFeedback.textContent = `Enter a valid ${lens}-digit number for ${country.name}.`;
      phoneFeedback.className = "field-feedback error";
      syncMobileField();
      updateScheduleState();
      return;
    }

    if (country.leadRegex && !country.leadRegex.test(raw)) {
      phoneFeedback.textContent = `That doesn't look like a valid ${country.name} mobile number.`;
      phoneFeedback.className = "field-feedback error";
      syncMobileField();
      updateScheduleState();
      return;
    }

    phoneValid = true;
    phoneFeedback.textContent = `Looks good — ${country.dial || ''} ${raw}`.trim();
    phoneFeedback.className = "field-feedback ok";
    syncMobileField();
    updateScheduleState();
  }

  countrySelect.addEventListener('change', () => {
    const c = currentCountry();
    phoneInput.placeholder = c.len[0] === 10 ? "00000 00000" : "0".repeat(c.len[0]);
    validatePhone();
  });

  phoneInput.addEventListener('input', () => {
    phoneInput.value = phoneInput.value.replace(/[^\d\s]/g, '');
    validatePhone();
  });

  // ---------- Auto-name-from-email (email comes in silently via URL param) ----------
  // Since this page is sent out by email to people whose addresses you
  // already have, the email itself is passed in the link (e.g.
  // ...?email=john.doe@example.com) rather than typed into a visible field.
  const realEmailField = document.getElementsByName('Email')[0];
  const lastNameField = document.getElementsByName('Last Name')[0];
  let nameManuallyEdited = false;

  // Any real user keystroke inside the Name field means we should stop
  // overwriting it automatically.
  lastNameField.addEventListener('input', () => {
    nameManuallyEdited = true;
  });

  function guessNameFromEmail(email) {
    const local = email.split('@')[0];
    const cleaned = local.replace(/[0-9]+$/g, '');
    const parts = cleaned.split(/[._\-+]+/).filter(Boolean);
    if (!parts.length) return '';
    return parts
      .map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase())
      .join(' ');
  }

  function initFromEmailParam() {
    const params = new URLSearchParams(window.location.search);
    const emailFromUrl = (params.get('email') || '').trim();
    if (!emailFromUrl) return;

    realEmailField.value = emailFromUrl;

    if (!nameManuallyEdited) {
      const guessed = guessNameFromEmail(emailFromUrl);
      if (guessed) {
        lastNameField.value = guessed;
      }
    }
  }

  // ---------- Custom dropdown widget (shared behavior for date + time) ----------
  function setupDropdown(dropdownId, triggerId, triggerTextId, panelId, options, onSelect) {
    const dropdownEl = document.getElementById(dropdownId);
    const triggerEl = document.getElementById(triggerId);
    const triggerTextEl = document.getElementById(triggerTextId);
    const panelEl = document.getElementById(panelId);

    options.forEach(opt => {
      const optEl = document.createElement('div');
      optEl.className = 'dropdown-option';
      optEl.textContent = opt.label;
      optEl.dataset.value = opt.value;
      optEl.addEventListener('click', () => {
        panelEl.querySelectorAll('.dropdown-option').forEach(o => o.classList.remove('selected'));
        optEl.classList.add('selected');
        triggerTextEl.textContent = opt.label;
        triggerEl.classList.remove('placeholder');
        closeDropdown(dropdownEl);
        onSelect(opt.value);
      });
      panelEl.appendChild(optEl);
    });

    triggerEl.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = dropdownEl.classList.contains('open');
      closeAllDropdowns();
      if (!isOpen) dropdownEl.classList.add('open');
    });
  }

  function closeDropdown(dropdownEl) {
    dropdownEl.classList.remove('open');
  }

  function closeAllDropdowns() {
    document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
  }

  document.addEventListener('click', closeAllDropdowns);

  // ---------- Preferred date dropdown ----------
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  let selectedDate = null;
  const DAYS_AHEAD = 30;

  function buildDateOptions() {
    const opts = [];
    for (let i = 0; i < DAYS_AHEAD; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() + i);
      const label = d.toLocaleDateString('en-GB', {
        weekday: 'short',
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      });
      opts.push({ label: label, value: i });
    }
    return opts;
  }

  function populateDateDropdown() {
    setupDropdown('dateDropdown', 'dateTrigger', 'dateTriggerText', 'datePanel', buildDateOptions(), (idx) => {
      const d = new Date(today);
      d.setDate(today.getDate() + parseInt(idx, 10));
      selectedDate = { y: d.getFullYear(), m: d.getMonth(), d: d.getDate() };
      updateScheduleState();
    });
  }

  // ---------- Preferred time dropdown (selectable, 30-min steps) ----------
  let selectedSlot = null; // holds { hour: "11", minute: "00", ampm: "AM" }

  function buildTimeOptions() {
    const opts = [];
    const startHour = 11; // 11:00 AM
    const endHour = 19;   // 7:00 PM
    for (let h24 = startHour; h24 <= endHour; h24++) {
      for (const min of ["00", "30"]) {
        if (h24 === endHour && min === "30") continue; // stop at 7:00 PM
        const ampm = h24 < 12 ? "AM" : "PM";
        let h12 = h24 % 12;
        if (h12 === 0) h12 = 12;
        const h12Str = h12 < 10 ? "0" + h12 : "" + h12;
        const label = `${h12Str}:${min} ${ampm}`;
        opts.push({ label: label, value: JSON.stringify({ hour: h12Str, minute: min, ampm: ampm }) });
      }
    }
    return opts;
  }

  function populateTimeDropdown() {
    setupDropdown('timeDropdown', 'timeTrigger', 'timeTriggerText', 'timePanel', buildTimeOptions(), (val) => {
      selectedSlot = JSON.parse(val);
      updateScheduleState();
    });
  }

  // ---------- Schedule button state ----------
  const scheduleBtn = document.getElementById('formsubmit');
  const confirmMsg = document.getElementById('confirmMsg');

  function updateScheduleState() {
    const ready = selectedDate && selectedSlot && phoneValid;
    scheduleBtn.disabled = !ready;
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function syncHiddenDateTimeFields() {
    if (!selectedDate) return;
    const dateStr = `${pad2(selectedDate.d)}/${pad2(selectedDate.m + 1)}/${selectedDate.y}`;
    document.getElementById('LEADCF59').value = dateStr;
    if (selectedSlot) {
      document.getElementById('LEADCF59hour').value = selectedSlot.hour;
      document.getElementById('LEADCF59minute').value = selectedSlot.minute;
      document.getElementById('LEADCF59ampm').value = selectedSlot.ampm;
    }
  }

  let formSubmitted = false;

  // Called from the form's onsubmit attribute — wraps our own checks
  // around Zoho's original checkMandatory2196827000114644019() function
  // (that function itself is left completely untouched).
  function scheduleSubmit() {
    if (!selectedDate) {
      alert('Please select a preferred date.');
      return false;
    }
    if (!selectedSlot) {
      alert('Please select a preferred time.');
      return false;
    }
    if (!phoneValid) {
      alert('Please enter a valid mobile number.');
      phoneInput.focus();
      return false;
    }
    if (!lastNameField.value.trim()) {
      alert('Please enter your name.');
      lastNameField.focus();
      return false;
    }

    syncHiddenDateTimeFields();
    syncMobileField();

    const ok = checkMandatory2196827000114644019();
    if (ok) {
    formSubmitted = true;

    confirmMsg.innerHTML =
      'Submitting your request... Please wait.<br><a href="https://theindusclub.com/Email_CTA/CTAThankyou.html" style="color:#4a8f4a;font-weight:700;text-decoration:underline;">Click here if you are not redirected.</a>';

    // Give the browser time to send the POST to Zoho
    setTimeout(function () {
        window.location.href = 'https://theindusclub.com/Email_CTA/CTAThankyou.html';
    }, 1000);   // 1000-1500ms is ideal
}

return ok;
  }

  document.getElementById('hidden_iframe').addEventListener('load', function () {
    // Kept only as a safety net / for debugging — the actual redirect now
    // happens immediately from scheduleSubmit() so it doesn't depend on
    // this event firing reliably across browsers.
  });

  // init
  populateDateDropdown();
  populateTimeDropdown();
  validatePhone();
  initFromEmailParam();
  updateScheduleState();
</script>
