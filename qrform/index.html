/* CARD */

.form-container{

/* CLOSE BUTTON */

.close-btn{
position:absolute;
top:15px;
right:20px;
font-size:22px;
color:#777;
cursor:pointer;
}

/* LOGO */

.form-logo{
text-align:center;
margin-bottom:15px;
}

.form-logo img{
max-height:80px;
width:auto;
display:block;
margin:0 auto;
}

/* DESCRIPTION */

.form-description{
text-align:center;
font-size:14px;
color:#9F865E;
line-height:1.6;
margin:0px 0px 25px;
font-weight:bold;
font-family:'Walburn-Regular-2';
max-width:628px;
margin-left:auto;
margin-right:auto;
}

/* GRID */

.form-grid{
display:grid;
grid-template-columns:46% 46%;
justify-content:space-between;
row-gap:22px;
margin-top:40px;
width:100%;
}

/* INPUTS */

.form-grid input,
.form-grid select{
width:100%;
padding:12px 14px;
border:1px solid #cfcfcf;
border-radius:0;
font-size:14px;
outline:none;
background:transparent;
color:#444;
}

.form-grid input:hover,
.form-grid select:hover{
border-color:#c5a880;
background:#fff;
}

.form-grid input:focus,
.form-grid select:focus{
border-color:#cfcfcf;
background:transparent;
box-shadow:none;
}

.full{
grid-column:1 / 3;
}

/* BUTTON */

.submit-btn{
margin-top:25px;
background:#C8b38a;
border:none;
padding:10px 42px;
color:white;
font-size:12px;
letter-spacing:3px;
cursor:pointer;
display:block;
margin-left:auto;
margin-right:auto;
}

.submit-btn:hover{
background:#b4976e;
transform:translateY(-2px);
box-shadow:0 6px 20px rgba(0,0,0,0.15);
}


@media (max-width:768px){

.form-container{
padding:35px 25px;
}

.form-grid{
grid-template-columns:100%;
}

.full{
grid-column:auto;
}

.form-logo img{
max-height:180px;
}

}


</style>
