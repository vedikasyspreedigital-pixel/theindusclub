<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Indus Club - Odyssey Movie Screening</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #fff;
    display: flex;
    justify-content: center;
    padding: 60px 20px;
    font-family: 'Playfair Display', serif;
  }

  .card {
    width: 100%;
    max-width: 700px;
    text-align: center;
  }

  .card p {
    color: #a97b3f;
    font-size: 26px;
    line-height: 1.5;
    margin-bottom: 28px;
  }

  .card p sup {
    font-size: 15px;
    top: -0.6em;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: #c9a15a;
    margin: 40px 0 30px 0;
  }

  .brand-logo {
    max-width: 320px;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>

<div class="card">
  <p>Excited to have you join us!</p>
  <p>We look forward to seeing you at 'The Odyssey' screening on Saturday 19<sup>th</sup> September at 7:30 pm</p>
  <p>We will call or message you to confirm your presence.</p>
  <p>Best Regards,</p>
  <p>Guest Relations Team</p>

  <div class="divider"></div>

  <img class="brand-logo" src="assets/img/dj_night.png" alt="The Indus Club - Where Every Handshake Matters">
</div>

</body>
</html>
